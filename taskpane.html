<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Vienkarsis Add-in</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; margin: 0; background-color: #f3f2f1; }
    h3 { color: #323130; margin-top: 0; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #514f4e; font-size: 0.9em; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #a19f9d; border-radius: 2px; }
    input:focus { border-color: #107c41; outline: none; }
    button { width: 100%; padding: 10px; background-color: #107c41; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 2px; }
    button:hover { background-color: #0b5930; }
    .status { margin-top: 15px; font-size: 0.9em; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Iestatijumi</h3>
  <div class="field">
    <label for="triggerColumn">Merka kolona (piem. A):</label>
    <input type="text" id="triggerColumn" placeholder="Ievadiet kolonas burtu" maxlength="3" />
  </div>
  <div class="field">
    <label for="resultColumn">Rezultata kolona (piem. B):</label>
    <input type="text" id="resultColumn" placeholder="Ievadiet kolonas burtu" maxlength="3" />
  </div>
  <button id="saveButton">Saglabat iestatijumus</button>
  <div id="status" class="status"></div>
  <script src="taskpane.js" type="text/javascript" defer></script>
</body>
</html>
