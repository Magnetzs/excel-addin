<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Timestamp Utility</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f3f2f1;
      color: #323130;
      padding: 16px;
      font-size: 14px;
    }

    .header {
      background: #107c41;
      color: white;
      padding: 12px 16px;
      margin: -16px -16px 16px -16px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header span { font-size: 18px; }

    .sheet-info {
      background: #e8f5e9;
      border-left: 3px solid #107c41;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #107c41;
      font-weight: 600;
      border-radius: 0 4px 4px 0;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 12px;
      color: #605e5c;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-icon {
      font-size: 16px;
      width: 24px;
      text-align: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #a19f9d;
      border-radius: 3px;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      text-transform: uppercase;
      background: white;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #107c41;
      outline: none;
      box-shadow: 0 0 0 1px #107c41;
    }

    .hint {
      font-size: 11px;
      color: #a19f9d;
      margin-top: 3px;
      margin-left: 32px;
    }

    .divider {
      border: none;
      border-top: 1px solid #edebe9;
      margin: 16px 0;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      background: #107c41;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: background 0.15s;
    }

    .btn-save:hover { background: #0b5930; }
    .btn-save:active { background: #094d28; }

    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #e8f5e9;
      color: #107c41;
      border: 1px solid #107c41;
      display: block;
    }

    .status.error {
      background: #fde7e9;
      color: #a80000;
      border: 1px solid #a80000;
      display: block;
    }

    .status.info {
      background: #e8f4fd;
      color: #005a9e;
      border: 1px solid #005a9e;
      display: block;
    }

    .listener-status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 3px;
      font-size: 12px;
      background: #f3f2f1;
      border: 1px solid #edebe9;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a19f9d;
      flex-shrink: 0;
    }

    .dot.active { background: #107c41; }
    .dot.inactive { background: #a80000; }
  </style>
</head>
<body>
  <div class="header">
    <span>⏱</span> Timestamp Utility
  </div>

  <div class="sheet-info" id="sheetInfo">Ielādē...</div>

  <div class="field">
    <label>Trigera kolonna</label>
    <div class="input-row">
      <span class="input-icon">＋</span>
      <input type="text" id="triggerCol" placeholder="Piem. A" maxlength="3"/>
    </div>
    <div class="hint">Šūnā ievadot +, tiks reģistrēts datums un laiks</div>
  </div>

  <div class="field">
    <label>Datuma kolonna</label>
    <div class="input-row">
      <span class="input-icon">📅</span>
      <input type="text" id="dateCol" placeholder="Piem. B" maxlength="3"/>
    </div>
    <div class="hint">Formāts: dd.mm.yyyy</div>
  </div>

  <div class="field">
    <label>Laika kolonna</label>
    <div class="input-row">
      <span class="input-icon">🕐</span>
      <input type="text" id="timeCol" placeholder="Piem. C" maxlength="3"/>
    </div>
    <div class="hint">Formāts: hh:mm</div>
  </div>

  <hr class="divider"/>

  <button class="btn-save" id="saveBtn">💾 Saglabāt iestatījumus</button>

  <div class="status" id="status"></div>

  <div class="listener-status">
    <div class="dot" id="listenerDot"></div>
    <span id="listenerText">Pārbauda klausītāja statusu...</span>
  </div>

  <script src="taskpane.js" defer></script>
</body>
</html>
